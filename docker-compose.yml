services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl_dev
      POSTGRES_DB: enterprise_warehouse
    ports:
      - "5435:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d enterprise_warehouse"]
      interval: 5s
      timeout: 3s
      retries: 12

  etl:
    build: .
    environment:
      DATABASE_URL: postgresql://etl:etl_dev@warehouse:5432/enterprise_warehouse
      CUSTOMERS_API_URL: https://jsonplaceholder.typicode.com/users
      ORDERS_CSV_PATH: data/source/orders.csv
      RAW_DATA_DIR: data/raw
      REJECTS_DIR: data/rejects
      ETL_HTTP_TIMEOUT_SECONDS: 20
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/rejects:/app/data/rejects
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
