name: ETL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etl_test
          POSTGRES_PASSWORD: etl_test
          POSTGRES_DB: etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_test -d etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://etl_test:etl_test@localhost:5432/etl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit and PostgreSQL integration tests
        run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q etl tests
